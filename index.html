<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kitchen & Market</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNtYXJ0IEtpdGNoZW4gJiBNYXJrZXQiLAogICJzaG9ydF9uYW1lIjogIlNtYXJ0IEtpdGNoZW4iLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2ZmZmZmZiIsCiAgInRoZW1lX2NvbG9yIjogIiMxMGI5ODEiLAogICJpY29ucyI6IFt7CiAgICAic3JjIjogImh0dHBzOi8vZW1vamkudGVkZHAuY29tL3ZmL3UvMTIxNTk0MDgvMTI4LzEyOC9kYy9zcHJpbmtsZS1jaG9jb2xhdGUtY29uZmV0dGktY2F0LTEyOC5wbmciLAogICAgInNpemVzIjogIjEyOHgxMjgiLAogICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogIH1dCn0=">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v4/dist/tesseract.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Sans', sans-serif; }
        .tab-content.hidden { display: none; }
        .glass-card { background: #ffffff; border: 1px solid #f0f0f0; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .btn-main { transition: all 0.25s ease; }
        .btn-main:active { transform: scale(0.98); }
        .tab-btn { color: #9ca3af; transition: all 0.3s; }
        .tab-btn.active { color: #1f2937; font-weight: 700; }
        .animate-item { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 pb-24" style="background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);">

    <header class="p-6 pb-2">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Lista de Hoje</h1>
                <p class="text-sm text-gray-400 font-medium mt-1">Gerencie suas compras</p>
            </div>
            <button onclick="openScanner()" class="p-4 bg-gray-900 text-white rounded-2xl">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6v6H4zM4 4h6v6H4zM14 14h6v6h-6zM14 4h6v6h-6z"/></svg>
            </button>
        </div>
    </header>

    <main id="app" class="p-4 max-w-2xl mx-auto">
        <div id="lista" class="tab-content">
            <div class="bg-gray-900 p-6 rounded-3xl shadow-sm mb-6 text-white">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Orçamento</span>
                        <div class="flex items-center gap-1 mt-1">
                            <span class="text-gray-400 font-bold">R$</span>
                            <input type="number" id="inputBudget" onchange="updateBudget()" class="bg-transparent text-2xl font-black text-white w-24 border-b border-gray-700 focus:outline-none focus:border-white" value="200">
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Disponível</span>
                        <div id="displaySaldo" class="text-2xl font-black text-emerald-400 mt-1">0.00</div>
                    </div>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2">
                    <div id="budgetBar" class="h-2 rounded-full bg-emerald-400 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="flex gap-3 mb-6">
                <button onclick="openScanner()" class="btn-main flex-1 bg-white border border-gray-200 p-4 rounded-2xl font-bold text-gray-800 flex items-center justify-center gap-2 shadow-sm">
                    <span>📷</span> Escanear
                </button>
                <button onclick="document.getElementById('modalManual').classList.remove('hidden')" class="btn-main flex-1 bg-emerald-600 text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm">
                    <span>➕</span> Adicionar
                </button>
            </div>

            <div id="items-container" class="space-y-3 mb-6"></div>
            <button onclick="finalizarCompra()" class="btn-main w-full py-4 bg-gray-900 text-white font-bold rounded-2xl shadow-sm text-center">
                Finalizar Compra
            </button>
        </div>

        <div id="estoque" class="tab-content hidden">
            <button onclick="document.getElementById('modalNota').classList.remove('hidden')" class="btn-main w-full mb-6 py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-sm text-center">
                📸 Escanear Nota Fiscal
            </button>
            <div id="estoque-container" class="space-y-3"></div>
        </div>

        <div id="receitas" class="tab-content hidden">
            <div class="p-12 text-center">
                <div class="text-6xl mb-4">👨‍🍳</div>
                <h2 class="text-lg font-bold text-gray-900 mb-2">Receitas em Breve</h2>
                <p class="text-gray-400">Sugestões de pratos com seus ingredientes virão em breve.</p>
            </div>
        </div>

        <div id="relatorio" class="tab-content hidden">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-6 tracking-tight">Histórico</h2>
            <div id="historico-container" class="space-y-4 mb-24"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <!-- Bottom Navigation -->
    <nav class="fixed bottom-6 left-6 right-6 z-50 bg-white border border-gray-100 shadow-2xl rounded-3xl p-3 flex justify-around items-center">
        <button onclick="showTab('lista')" class="tab-btn active flex flex-col items-center gap-1 p-2" data-tab="lista">
            <span class="text-2xl">📋</span>
            <span class="text-[10px] font-bold uppercase tracking-wider">Lista</span>
        </button>
        <button onclick="showTab('estoque')" class="tab-btn flex flex-col items-center gap-1 p-2" data-tab="estoque">
            <span class="text-2xl">🏠</span>
            <span class="text-[10px] font-bold uppercase tracking-wider">Estoque</span>
        </button>
        <button onclick="showTab('receitas')" class="tab-btn flex flex-col items-center gap-1 p-2" data-tab="receitas">
            <span class="text-2xl">👨‍🍳</span>
            <span class="text-[10px] font-bold uppercase tracking-wider">Receitas</span>
        </button>
        <button onclick="showTab('relatorio')" class="tab-btn flex flex-col items-center gap-1 p-2" data-tab="relatorio">
            <span class="text-2xl">📈</span>
            <span class="text-[10px] font-bold uppercase tracking-wider">Gastos</span>
        </button>
    </nav>

    <!-- Modal Preço -->
    <div id="modalPreco" class="fixed inset-0 bg-black/40 hidden z-50 flex items-end justify-center p-4">
        <div class="bg-white w-full rounded-3xl p-6 shadow-2xl max-w-md">
            <h2 id="tituloProduto" class="text-2xl font-black text-gray-900 mb-6">Qual o preço?</h2>
            <input type="number" id="inputPrecoItem" class="w-full border border-gray-200 p-4 rounded-2xl mb-6 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00" step="0.01">
            <div class="flex gap-3">
                <button onclick="confirmarAdicao()" class="btn-main flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Confirmar</button>
                <button onclick="document.getElementById('modalPreco').classList.add('hidden')" class="btn-main flex-1 bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Nota -->
    <div id="modalNota" class="fixed inset-0 bg-black/40 hidden z-50 flex items-end justify-center p-4">
        <div class="bg-white w-full rounded-3xl p-6 shadow-2xl max-w-md">
            <h2 class="text-2xl font-black text-gray-900 mb-6">📸 Ler Nota</h2>
            <input type="file" id="fileNota" accept="image/*" class="w-full mb-4 p-3 border-2 border-dashed border-gray-300 rounded-2xl">
            <textarea id="textNota" class="w-full border border-gray-200 rounded-2xl p-4 mb-6 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Ou cole o texto..." rows="4"></textarea>
            <div class="flex gap-3">
                <button onclick="processarNota()" class="btn-main flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Processar</button>
                <button onclick="document.getElementById('modalNota').classList.add('hidden')" class="btn-main flex-1 bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Manual -->
    <div id="modalManual" class="fixed inset-0 bg-black/40 hidden z-50 flex items-end justify-center p-4">
        <div class="bg-white w-full rounded-3xl p-6 shadow-2xl max-w-md">
            <h2 class="text-2xl font-black text-gray-900 mb-6">Novo Produto</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Produto</label>
                    <input type="text" id="manualName" class="w-full border border-gray-200 p-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Ex: Maçã">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Tipo</label>
                    <select id="manualType" onchange="toggleManualType()" class="w-full border border-gray-200 p-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="un">Unidade</option>
                        <option value="kg">Pesável (Kg)</option>
                    </select>
                </div>
                <div id="fieldsUnidade">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Preço (R$)</label>
                    <input type="number" id="manualPrice" step="0.01" class="w-full border border-gray-200 p-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00">
                </div>
                <div id="fieldsPesavel" class="hidden space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Preço/Kg (R$)</label>
                        <input type="number" id="manualPriceKg" step="0.01" class="w-full border border-gray-200 p-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00" oninput="calcularPesavel()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Peso (kg ou g)</label>
                        <input type="number" id="manualWeight" step="0.001" class="w-full border border-gray-200 p-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.500">
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total</div>
                        <div class="text-2xl font-black text-emerald-600">R$ <span id="manualCalculatedTotal">0.00</span></div>
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="adicionarManual()" class="btn-main flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Adicionar</button>
                <button onclick="document.getElementById('modalManual').classList.add('hidden')" class="btn-main flex-1 bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('appState')) || { budget: 200, items: [], estoque: [], historico: [] };

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabId);
            });
            if(tabId === 'relatorio') renderHistorico();
        }

        function save() { localStorage.setItem('appState', JSON.stringify(state)); render(); renderHistorico(); }

        function toast(msg, type = 'success') {
            const colors = { success: 'from-green-400 to-emerald-500', error: 'from-red-400 to-pink-500', info: 'from-amber-400 to-orange-500' };
            const t = document.createElement('div');
            t.className = `fixed bottom-28 left-1/2 -translate-x-1/2 bg-gradient-to-r ${colors[type]} text-white px-6 py-4 rounded-2xl shadow-2xl z-[70] text-sm font-bold max-w-[90%] text-center`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        
        
        function updateBudget() {
            state.budget = parseFloat(document.getElementById('inputBudget').value);
            save();
        }

        function render() {
            // Orçamento
            const total = state.items.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);
            const saldo = (state.budget || 0) - total;
            const pct = state.budget > 0 ? Math.min(100, (total / state.budget) * 100) : 0;
            const saldoEl = document.getElementById('displaySaldo');
            if (saldoEl) {
                saldoEl.innerText = saldo.toFixed(2);
                saldoEl.className = `text-3xl font-bold ${saldo < 0 ? 'text-red-300' : 'text-white'}`;
            }
            const barEl = document.getElementById('budgetBar');
            if (barEl) {
                barEl.style.width = pct + '%';
                if (pct > 90) barEl.style.backgroundColor = '#ef4444';
                else if (pct > 70) barEl.style.backgroundColor = '#f59e0b';
                else barEl.style.backgroundColor = '#10b981';
            }
            if (document.getElementById('inputBudget')) document.getElementById('inputBudget').value = state.budget;

            const container = document.getElementById('items-container');
            if(container) {
                if (state.items.length === 0) {
                    container.innerHTML = '<div class="bg-white/50 backdrop-blur-sm p-10 rounded-3xl text-center text-gray-400 shadow-sm"><div class="text-5xl mb-3">🛒</div>Sua lista está vazia.<br>Use os botões acima para começar!</div>';
                } else {
                    container.innerHTML = state.items.map(item => `
                        <div class="flex items-center p-4 bg-white border border-gray-100 rounded-3xl shadow-sm animate-item">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${item.id})" class="mr-4 h-5 w-5 rounded-md border-gray-300 text-emerald-600 focus:ring-emerald-500">
                            <div class="flex-grow">
                                <div class="font-bold text-gray-800 ${item.checked ? 'line-through text-gray-300' : ''}">${item.name}</div>
                                <div class="text-[11px] font-bold text-gray-400 uppercase tracking-tighter">${item.qty || 1} ${item.unit || 'un'}</div>
                            </div>
                            <div class="font-black text-gray-900">R$ ${(item.price || 0).toFixed(2)}</div>
                        </div>
                    `).join('');
                }
            }
            
            const eContainer = document.getElementById('estoque-container');
            if(eContainer) {
                if (state.estoque.length === 0) {
                    eContainer.innerHTML = '<div class="p-12 text-center text-gray-300"><div class="text-5xl mb-3">📦</div>Seu estoque está vazio.</div>';
                } else {
                    eContainer.innerHTML = state.estoque.map((i, idx) => `
                        <div class="p-4 bg-white border border-gray-100 rounded-3xl shadow-sm animate-item">
                            <div class="font-bold text-gray-800">${i.name}</div>
                            ${i.qty ? `<div class="text-[11px] font-bold text-gray-400 uppercase tracking-tighter mt-1">${i.qty}${i.unit || ''}</div>` : ''}
                        </div>
                    `).join('');
                }
            }
        }

        let tempProduct = null;

        function toggleItem(id) {
            const item = state.items.find(i => i.id === id);
            if (item) item.checked = !item.checked;
            save();
        }

        let html5Scanner = null;

        async function openScanner() {
            // Evita abrir duas instâncias
            if (document.getElementById('tempScanner')) return;

            const modal = document.createElement('div');
            modal.id = 'tempScanner';
            modal.className = 'fixed inset-0 bg-black z-[60] flex flex-col';
            modal.innerHTML = `
                <div class="p-4 text-white text-center bg-gray-900 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-lg">Escanear Produto</div>
                        <div class="text-xs text-gray-400 mt-0.5">Aponte a câmera para o código de barras</div>
                    </div>
                    <button onclick="fecharScanner()" class="bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl text-sm font-bold">✕</button>
                </div>
                <div id="reader" class="flex-grow flex items-center justify-center bg-black overflow-hidden relative"></div>
                <div class="p-4 bg-gray-900 border-t border-gray-800 flex flex-col gap-2">
                    <div class="text-xs text-gray-400 text-center">Câmera não abriu ou sem leitor? Digite o EAN (código de barras):</div>
                    <div class="flex gap-2">
                        <input type="text" id="manualEanInput" class="flex-1 bg-gray-800 text-white border border-gray-700 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500" placeholder="Ex: 7891000100103">
                        <button onclick="simularEanManual()" class="bg-emerald-600 text-white px-5 py-3 rounded-xl font-bold text-sm">Buscar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            try {
                html5Scanner = new Html5Qrcode("reader");

                const config = {
                    fps: 15,
                    qrbox: (viewW, viewH) => {
                        const w = Math.floor(viewW * 0.85);
                        const h = Math.floor(viewH * 0.5);
                        return { width: w, height: Math.min(h, 300) };
                    },
                    aspectRatio: 1.0
                };

                if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
                    const F = Html5QrcodeSupportedFormats;
                    config.formatsToSupport = [
                        F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
                        F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE
                    ].filter(v => v !== undefined);
                }

                await html5Scanner.start(
                    { facingMode: "environment" },
                    config,
                    (text) => {
                        fecharScanner(true);
                        buscarProduto(text);
                    },
                    () => {}
                );
            } catch (err) {
                console.error('Erro ao iniciar câmera:', err);
                // Não fechamos o modal imediatamente para permitir digitar o EAN manual se a câmera falhar
                const readerEl = document.getElementById('reader');
                if (readerEl) {
                    readerEl.innerHTML = `
                        <div class="text-center p-6 text-gray-400">
                            <div class="text-4xl mb-2">📷⚠️</div>
                            <div class="text-sm font-bold text-white mb-1">Câmera indisponível ou bloqueada</div>
                            <div class="text-xs">Use o campo abaixo para digitar o código de barras.</div>
                        </div>
                    `;
                }
            }
        }

        function simularEanManual() {
            const val = document.getElementById('manualEanInput').value.trim();
            if (!val) return toast('Digite o código de barras', 'error');
            fecharScanner(true);
            buscarProduto(val);
        }

        async function fecharScanner(silencioso = false) {
            try {
                if (html5Scanner) {
                    await html5Scanner.stop();
                    await html5Scanner.clear();
                }
            } catch (e) { /* ignorar */ }
            html5Scanner = null;
            const modal = document.getElementById('tempScanner');
            if (modal) modal.remove();
        }

        async function buscarProduto(ean) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${ean}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    tempProduct = {
                        name: data.product.product_name || 'Produto sem nome',
                        cat: data.product.categories_tags ? data.product.categories_tags[0].replace('en:', '') : 'Outros'
                    };
                    document.getElementById('tituloProduto').innerText = tempProduct.name;
                    document.getElementById('modalPreco').classList.remove('hidden');
                    document.getElementById('inputPrecoItem').focus();
                } else {
                    toast('Produto não encontrado.', 'error');
                }
            } catch (e) { toast('Erro na busca.', 'error'); }
        }

        function confirmarAdicao() {
            const p = parseFloat(document.getElementById('inputPrecoItem').value);
            if (!p || p <= 0) return toast("Digite o preço.", 'error');
            state.items.push({ id: Date.now(), ...tempProduct, price: p, checked: true, qty: 1, unit: 'un' });
            save();
            document.getElementById('modalPreco').classList.add('hidden');
            document.getElementById('inputPrecoItem').value = '';
        }

        async function processarNota() {
            const file = document.getElementById('fileNota').files[0];
            const text = document.getElementById('textNota').value;
            let final = text;
            if (file) {
                const res = await Tesseract.recognize(file, 'por');
                final = res.data.text;
            }
            if (!final) return toast("Nada para processar.", 'error');
            final.split('\n').forEach(l => {
                if (l.trim().length > 3) state.estoque.push({ name: l.trim() });
            });
            save();
            document.getElementById('modalNota').classList.add('hidden');
        }

        function toggleManualType() {
            const type = document.getElementById('manualType').value;
            document.getElementById('fieldsUnidade').classList.toggle('hidden', type === 'kg');
            document.getElementById('fieldsPesavel').classList.toggle('hidden', type === 'un');
        }

        function calcularPesavel() {
            let priceKg = parseFloat(document.getElementById('manualPriceKg').value) || 0;
            let weight = parseFloat(document.getElementById('manualWeight').value) || 0;
            
            // Heurística simples: se o peso for maior que 10, assumimos que é em gramas
            if (weight > 10) weight = weight / 1000;
            
            const total = priceKg * weight;
            document.getElementById('manualCalculatedTotal').innerText = total.toFixed(2);
            return { total, weight };
        }

        function adicionarManual() {
            const name = document.getElementById('manualName').value;
            const type = document.getElementById('manualType').value;
            
            if (!name) return toast("Digite o nome do produto.", 'error');

            let item = { id: Date.now(), name, checked: true, cat: 'Manual' };

            if (type === 'un') {
                const price = parseFloat(document.getElementById('manualPrice').value);
                if (!price || price <= 0) return toast("Digite o preço.", 'error');
                item.price = price;
                item.qty = 1;
                item.unit = 'un';
            } else {
                const calc = calcularPesavel();
                if (!calc.total || calc.total <= 0) return toast("Preencha o preço e o peso.", 'error');
                item.price = calc.total;
                item.qty = calc.weight;
                item.unit = 'kg';
            }

            state.items.push(item);
            save();
            document.getElementById('modalManual').classList.add('hidden');
            
            // Limpar campos
            document.getElementById('manualName').value = '';
            document.getElementById('manualPrice').value = '';
            document.getElementById('manualPriceKg').value = '';
            document.getElementById('manualWeight').value = '';
            document.getElementById('manualCalculatedTotal').innerText = '0.00';
            
            toast("Produto adicionado!");
        }

        function finalizarCompra() {
            const checkedItems = state.items.filter(i => i.checked);
            if (checkedItems.length === 0) {
                return toast("Nenhum item marcado para finalizar.", 'error');
            }
            
            const totalPlanned = state.budget;
            const totalSpent = checkedItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            const compra = {
                id: Date.now(),
                date: new Date().toLocaleDateString('pt-BR'),
                totalPlanned: totalPlanned,
                totalSpent: totalSpent,
                itemsCount: checkedItems.length,
                items: checkedItems.map(i => ({ name: i.name, qty: i.qty, unit: i.unit, price: i.price }))
            };
            
            state.historico.push(compra);
            state.items = state.items.filter(i => !i.checked);
            save();
            toast("Compra finalizada com sucesso! ✅");
            showTab('relatorio');
        }

        function renderHistorico() {
            const container = document.getElementById('historico-container');
            if (!container) return;
            
            if (state.historico.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-300 font-medium">Nenhum registro.</div>';
                return;
            }
            
            container.innerHTML = state.historico.slice().reverse().map(h => `
                <div class="p-6 bg-white border border-gray-100 rounded-3xl animate-item shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">${h.date}</div>
                            <div class="font-black text-gray-900">${h.itemsCount} produtos</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total</div>
                            <div class="font-black text-emerald-600">R$ ${h.totalSpent.toFixed(2)}</div>
                        </div>
                    </div>
                    <details class="group">
                        <summary class="list-none cursor-pointer text-xs font-bold text-gray-900 flex items-center justify-between opacity-50 hover:opacity-100 transition-opacity">
                            DETALHES DA COMPRA
                            <span class="group-open:rotate-180 transition-transform">↓</span>
                        </summary>
                        <div class="mt-4 pt-4 border-t border-gray-50 space-y-2">
                            ${h.items.map(i => `
                                <div class="flex justify-between text-sm font-medium">
                                    <span class="text-gray-500">${i.name}</span>
                                    <span class="text-gray-900 font-bold">R$ ${i.price.toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </details>
                </div>
            `).join('');
        }

        showTab('lista');
        render();

        // Criar botão de instalação dinamicamente no header
        const headerDiv = document.querySelector('header > div');
        if (headerDiv) {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'flex gap-2';
            const scannerBtn = headerDiv.querySelector('button');
            const btnInstalar = document.createElement('button');
            btnInstalar.id = 'btnInstalar';
            btnInstalar.className = 'p-4 bg-emerald-600 text-white rounded-2xl hover:bg-emerald-700 transition-colors hidden';
            btnInstalar.title = 'Instalar aplicativo';
            btnInstalar.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7-7 7 7"/></svg>';
            btnContainer.appendChild(scannerBtn.cloneNode(true));
            btnContainer.appendChild(btnInstalar);
            headerDiv.replaceChild(btnContainer, scannerBtn);
        }

        // Registrar Service Worker simples via Data URI (exigido para PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch", (e) => {});')
                .catch(e => console.log('SW error:', e));
        }

        // Suporte para instalação PWA (Prompt de instalação)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnInstalar');
            if(btn) btn.classList.remove('hidden');
        });

        const btnInstalar = document.getElementById('btnInstalar');
        if (btnInstalar) {
            btnInstalar.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') deferredPrompt = null;
                } else {
                    toast('No Android/iOS, use o menu do navegador (3 pontos/Compartilhar) -> "Adicionar à Tela Inicial"', 'info');
                }
            });
        }
    </script>
</body>
</html>
