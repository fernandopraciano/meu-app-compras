<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kitchen & Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/tesseract.js@v4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content.hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">🛒 Smart Kitchen</h1>
            <div class="flex gap-2">
                <button onclick="openScanner()" class="bg-amber-400 text-emerald-900 p-2 rounded-lg font-bold">📷</button>
                <button id="btnInstalar" class="bg-white text-emerald-700 px-3 py-1 rounded text-sm font-bold hidden">📲</button>
            </div>
        </div>
        <nav class="flex gap-2">
            <button onclick="showTab('lista')" class="tab-btn flex-1 py-2 bg-emerald-800 rounded font-semibold" data-tab="lista">🛒 Lista</button>
            <button onclick="showTab('estoque')" class="tab-btn flex-1 py-2 rounded" data-tab="estoque">🏠 Estoque</button>
            <button onclick="showTab('receitas')" class="tab-btn flex-1 py-2 rounded" data-tab="receitas">👨‍🍳 Receitas</button>
            <button onclick="showTab('relatorio')" class="tab-btn flex-1 py-2 rounded" data-tab="relatorio">📊 Gastos</button>
        </nav>
    </header>

    <main id="app" class="p-4 max-w-2xl mx-auto">
        <div id="lista" class="tab-content">
            <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-500">Orçamento (R$)</label><input type="number" id="inputBudget" onchange="updateBudget()" class="w-full border rounded p-1" value="200"></div>
                    <div><label class="text-xs text-gray-500">Saldo (R$)</label><div id="displaySaldo" class="font-bold text-emerald-700">0.00</div></div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2"><div id="budgetBar" class="bg-emerald-700 h-2.5 rounded-full" style="width: 0%"></div></div>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="openScanner()" class="bg-amber-400 text-emerald-900 py-3 rounded-xl font-bold shadow-md">📷 Escanear</button>
                <button onclick="document.getElementById('modalManual').classList.remove('hidden')" class="bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-md">➕ Adicionar</button>
            </div>

            <div id="items-container" class="space-y-2"></div>
            <div class="mt-6">
                <button onclick="finalizarCompra()" class="w-full py-4 bg-emerald-700 text-white font-bold rounded-xl shadow-lg">✅ Finalizar Compra</button>
            </div>
        </div>

        <div id="estoque" class="tab-content hidden">
            <button onclick="document.getElementById('modalNota').classList.remove('hidden')" class="w-full mb-4 py-3 bg-amber-400 text-emerald-900 font-bold rounded-lg shadow-md">🧾 Importar Nota Fiscal</button>
            <div id="estoque-container" class="space-y-2"></div>
        </div>

        <div id="receitas" class="tab-content hidden">
            <div class="text-center py-10 text-gray-500">Funcionalidade de Receitas em breve...</div>
        </div>

        <div id="relatorio" class="tab-content hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
                <h2 class="text-lg font-bold mb-4">📊 Histórico de Compras</h2>
                <div id="historico-container" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- Modal Preço -->
    <div id="modalPreco" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6">
            <h2 id="tituloProduto" class="text-lg font-bold mb-4">Adicionar Produto</h2>
            <label class="text-sm text-gray-600">Preço do item (R$):</label>
            <input type="number" id="inputPrecoItem" class="w-full border p-2 rounded mb-4" placeholder="0.00" step="0.01">
            <div class="flex gap-2">
                <button onclick="confirmarAdicao()" class="flex-1 bg-emerald-700 text-white py-2 rounded">✅ Confirmar</button>
                <button onclick="document.getElementById('modalPreco').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Nota -->
    <div id="modalNota" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-4">Ler Nota Fiscal</h2>
            <input type="file" id="fileNota" accept="image/*" class="w-full mb-4">
            <textarea id="textNota" class="w-full border rounded p-2 mb-4" placeholder="Ou cole o texto aqui..." rows="5"></textarea>
            <div class="flex gap-2">
                <button onclick="processarNota()" class="flex-1 bg-emerald-700 text-white py-2 rounded">Processar</button>
                <button onclick="document.getElementById('modalNota').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Manual -->
    <div id="modalManual" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6">
            <h2 class="text-lg font-bold mb-4">Adicionar Produto Manualmente</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-600">Nome do Produto</label>
                    <input type="text" id="manualName" class="w-full border p-2 rounded" placeholder="Ex: Maçã, Leite...">
                </div>
                <div>
                    <label class="text-xs text-gray-600">Tipo de Produto</label>
                    <select id="manualType" onchange="toggleManualType()" class="w-full border p-2 rounded">
                        <option value="un">Unidade / Outros</option>
                        <option value="kg">Pesável (Kg / Gramas)</option>
                    </select>
                </div>
                <div id="fieldsUnidade">
                    <label class="text-xs text-gray-600">Preço Total (R$)</label>
                    <input type="number" id="manualPrice" step="0.01" class="w-full border p-2 rounded" placeholder="0.00">
                </div>
                <div id="fieldsPesavel" class="hidden space-y-2">
                    <div>
                        <label class="text-xs text-gray-600">Preço por Kg (R$)</label>
                        <input type="number" id="manualPriceKg" step="0.01" class="w-full border p-2 rounded" placeholder="0.00" oninput="calcularPesavel()">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Peso (em kg ou g ex: 0.500 ou 500)</label>
                        <input type="number" id="manualWeight" step="0.001" class="w-full border p-2 rounded" placeholder="Ex: 0.500 (kg) ou 500 (g)" oninput="calcularPesavel()">
                    </div>
                    <div class="text-sm font-bold text-emerald-800">
                        Valor Calculado: R$ <span id="manualCalculatedTotal">0.00</span>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="adicionarManual()" class="flex-1 bg-emerald-700 text-white py-2 rounded font-bold">Adicionar</button>
                <button onclick="document.getElementById('modalManual').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('appState')) || { budget: 200, items: [], estoque: [], historico: [] };

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('bg-emerald-800', b.dataset.tab === tabId);
            });
            if(tabId === 'relatorio') renderHistorico();
        }

        function save() { localStorage.setItem('appState', JSON.stringify(state)); render(); renderHistorico(); }

        function toast(msg, type = 'success') {
            const colors = { success: 'bg-emerald-600', error: 'bg-rose-500', info: 'bg-amber-500' };
            const t = document.createElement('div');
            t.className = `fixed bottom-20 left-1/2 -translate-x-1/2 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-lg z-[70] text-sm font-semibold`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        
        
        function updateBudget() {
            state.budget = parseFloat(document.getElementById('inputBudget').value);
            save();
        }

        function render() {
            // Orçamento
            const total = state.items.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);
            const saldo = (state.budget || 0) - total;
            const pct = state.budget > 0 ? Math.min(100, (total / state.budget) * 100) : 0;
            const barColor = pct > 90 ? 'bg-rose-500' : pct > 70 ? 'bg-amber-400' : 'bg-emerald-700';
            const saldoEl = document.getElementById('displaySaldo');
            if (saldoEl) {
                saldoEl.innerText = saldo.toFixed(2);
                saldoEl.className = `font-bold ${saldo < 0 ? 'text-rose-500' : 'text-emerald-700'}`;
            }
            const barEl = document.getElementById('budgetBar');
            if (barEl) barEl.className = `${barColor} h-2.5 rounded-full transition-all`;
            if (barEl) barEl.style.width = pct + '%';
            if (document.getElementById('inputBudget')) document.getElementById('inputBudget').value = state.budget;

            const container = document.getElementById('items-container');
            if(container) {
                if (state.items.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-400">Sua lista está vazia. 📷 Escaneie um produto ou adicione manualmente.</div>';
                } else {
                    container.innerHTML = state.items.map(item => `
                        <div class="flex items-center p-3 bg-white rounded-lg shadow-sm">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${item.id})" class="mr-3 h-6 w-6">
                            <div class="flex-grow">
                                <div class="font-semibold ${item.checked ? 'line-through text-gray-400' : ''}">${item.name}</div>
                                <div class="text-xs text-gray-500">${item.qty || 1}${item.unit || 'un'}</div>
                            </div>
                            <div class="font-bold text-emerald-800">R$ ${(item.price || 0).toFixed(2)}</div>
                        </div>
                    `).join('');
                }
            }
            
            const eContainer = document.getElementById('estoque-container');
            if(eContainer) {
                eContainer.innerHTML = state.estoque.map(i => `
                    <div class="p-3 bg-white rounded shadow-sm">${i.name}</div>
                `).join('');
            }
        }

        let tempProduct = null;

        function toggleItem(id) {
            const item = state.items.find(i => i.id === id);
            if (item) item.checked = !item.checked;
            save();
        }

        async function openScanner() {
            const modal = document.createElement('div');
            modal.id = 'tempScanner';
            modal.className = 'fixed inset-0 bg-black z-[60] flex flex-col';
            modal.innerHTML = `
                <div id="reader" class="flex-grow"></div>
                <button onclick="document.getElementById('tempScanner').remove()" class="p-4 bg-rose-500 text-white font-bold">Fechar Câmera</button>
            `;
            document.body.appendChild(modal);
            
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (text) => {
                    scanner.stop();
                    modal.remove();
                    buscarProduto(text);
                }
            );
        }

        async function buscarProduto(ean) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${ean}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    tempProduct = {
                        name: data.product.product_name || 'Produto sem nome',
                        cat: data.product.categories_tags ? data.product.categories_tags[0].replace('en:', '') : 'Outros'
                    };
                    document.getElementById('tituloProduto').innerText = tempProduct.name;
                    document.getElementById('modalPreco').classList.remove('hidden');
                    document.getElementById('inputPrecoItem').focus();
                } else {
                    toast('Produto não encontrado.', 'error');
                }
            } catch (e) { toast('Erro na busca.', 'error'); }
        }

        function confirmarAdicao() {
            const p = parseFloat(document.getElementById('inputPrecoItem').value);
            if (!p || p <= 0) return toast("Digite o preço.", 'error');
            state.items.push({ id: Date.now(), ...tempProduct, price: p, checked: true, qty: 1, unit: 'un' });
            save();
            document.getElementById('modalPreco').classList.add('hidden');
            document.getElementById('inputPrecoItem').value = '';
        }

        async function processarNota() {
            const file = document.getElementById('fileNota').files[0];
            const text = document.getElementById('textNota').value;
            let final = text;
            if (file) {
                const res = await Tesseract.recognize(file, 'por');
                final = res.data.text;
            }
            if (!final) return toast("Nada para processar.", 'error');
            final.split('\n').forEach(l => {
                if (l.trim().length > 3) state.estoque.push({ name: l.trim() });
            });
            save();
            document.getElementById('modalNota').classList.add('hidden');
        }

        function toggleManualType() {
            const type = document.getElementById('manualType').value;
            document.getElementById('fieldsUnidade').classList.toggle('hidden', type === 'kg');
            document.getElementById('fieldsPesavel').classList.toggle('hidden', type === 'un');
        }

        function calcularPesavel() {
            let priceKg = parseFloat(document.getElementById('manualPriceKg').value) || 0;
            let weight = parseFloat(document.getElementById('manualWeight').value) || 0;
            
            // Heurística simples: se o peso for maior que 10, assumimos que é em gramas
            if (weight > 10) weight = weight / 1000;
            
            const total = priceKg * weight;
            document.getElementById('manualCalculatedTotal').innerText = total.toFixed(2);
            return { total, weight };
        }

        function adicionarManual() {
            const name = document.getElementById('manualName').value;
            const type = document.getElementById('manualType').value;
            
            if (!name) return toast("Digite o nome do produto.", 'error');

            let item = { id: Date.now(), name, checked: true, cat: 'Manual' };

            if (type === 'un') {
                const price = parseFloat(document.getElementById('manualPrice').value);
                if (!price || price <= 0) return toast("Digite o preço.", 'error');
                item.price = price;
                item.qty = 1;
                item.unit = 'un';
            } else {
                const calc = calcularPesavel();
                if (!calc.total || calc.total <= 0) return toast("Preencha o preço e o peso.", 'error');
                item.price = calc.total;
                item.qty = calc.weight;
                item.unit = 'kg';
            }

            state.items.push(item);
            save();
            document.getElementById('modalManual').classList.add('hidden');
            
            // Limpar campos
            document.getElementById('manualName').value = '';
            document.getElementById('manualPrice').value = '';
            document.getElementById('manualPriceKg').value = '';
            document.getElementById('manualWeight').value = '';
            document.getElementById('manualCalculatedTotal').innerText = '0.00';
            
            toast("Produto adicionado!");
        }

        function finalizarCompra() {
            const checkedItems = state.items.filter(i => i.checked);
            if (checkedItems.length === 0) {
                return toast("Nenhum item marcado para finalizar.", 'error');
            }
            
            const totalPlanned = state.budget;
            const totalSpent = checkedItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            const compra = {
                id: Date.now(),
                date: new Date().toLocaleDateString('pt-BR'),
                totalPlanned: totalPlanned,
                totalSpent: totalSpent,
                itemsCount: checkedItems.length,
                items: checkedItems.map(i => ({ name: i.name, qty: i.qty, unit: i.unit, price: i.price }))
            };
            
            state.historico.push(compra);
            state.items = state.items.filter(i => !i.checked);
            save();
            toast("Compra finalizada com sucesso! ✅");
            showTab('relatorio');
        }

        function renderHistorico() {
            const container = document.getElementById('historico-container');
            if (!container) return;
            
            if (state.historico.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400">Nenhuma compra registrada ainda.</div>';
                return;
            }
            
            container.innerHTML = state.historico.slice().reverse().map(h => {
                const diff = h.totalSpent - h.totalPlanned;
                const diffClass = diff > 0 ? 'text-rose-500' : 'text-emerald-600';
                const diffSymbol = diff > 0 ? '+' : '';
                
                return `
                    <div class="bg-white p-4 rounded-lg shadow border border-gray-100">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <div class="font-bold text-gray-800">${h.date}</div>
                                <div class="text-xs text-gray-500">${h.itemsCount} ${h.itemsCount === 1 ? 'item' : 'itens'}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-gray-500">Planejado: <span class="font-semibold">R$ ${h.totalPlanned.toFixed(2)}</span></div>
                                <div class="text-sm text-gray-500">Gasto: <span class="font-semibold">R$ ${h.totalSpent.toFixed(2)}</span></div>
                                <div class="text-sm font-bold ${diffClass}">${diffSymbol}R$ ${Math.abs(diff).toFixed(2)}</div>
                            </div>
                        </div>
                        <details class="text-xs text-gray-600 mt-2">
                            <summary class="cursor-pointer hover:text-emerald-700">Ver itens</summary>
                            <ul class="mt-2 space-y-1 pl-4">
                                ${h.items.map(i => `<li>• ${i.name} - ${i.qty}${i.unit} - R$ ${i.price.toFixed(2)}</li>`).join('')}
                            </ul>
                        </details>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>
